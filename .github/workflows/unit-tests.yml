name: Unit tests

on:
  push:
    branches:
      - develop

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          token: ${{ secrets.PAT }}

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          architecture: x64
          cache: true
          pub-cache: true

      - run: flutter --version
      - run: flutter pub get
      - run: flutter test
